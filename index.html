<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Med Karim Bchini — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a recruiter-facing CV, calm and exact
   IDEA a printed career dossier: one cover band, four tabbed role sheets, then the CV itself
   PICTURE the four role sheets as large selectable tabs, the active one opening into the CV
   COLOUR deep green #12512a band (from the reference site), white paper, mint #e6f2ea surfaces, one warm accent for figures
   TYPE Hanken Grotesk 300 large + Hanken Grotesk
   LAYOUT laptop: cover band with title + stats left, 2x2 role tabs right; phone: title, tabs stacked, CV below */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1511);--ink:light-dark(#111a14,#e8efe9);--mut:light-dark(#4d5b52,#a4b3a8);--g:#12512a;--g2:light-dark(#1d7a42,#5fd08b);--soft:light-dark(#e9f3ec,#16241b);--line:light-dark(#d3e2d8,#26392c);--acc:light-dark(#b4560f,#f2a35e);--card:light-dark(#ffffff,#121c16)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip}
a{color:var(--g2)}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
header.top{background:var(--g);color:#fff;padding:12px max(5vw,16px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.01em;color:#fff;text-decoration:none}
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:8px 16px;min-height:28px;font-weight:600;font-size:14px;color:#fff}
.lang button[aria-pressed=true]{background:#fff;color:var(--g)}
.lang button:focus-visible,.role:focus-visible,.more:focus-visible{outline:3px solid #9fe0b6;outline-offset:2px}
.cover{background:var(--g);color:#fff;padding-top:clamp(20px,3vw,40px)}
.cover .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:clamp(24px,4vw,56px);align-items:start}
.cover h1{font-weight:300;font-size:clamp(32px,4.4vw,50px);line-height:1.05;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.cover p{color:#d6eadc;margin:0 0 22px;max-width:46ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.2);border-radius:12px;overflow:hidden}
.facts div{background:#0f4523;padding:12px 14px}
.facts b{display:block;font-size:20px;font-weight:600;white-space:nowrap}
.facts span{font-size:13px;color:#cfe5d6}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.roles .role:first-child,.roles .role:nth-child(even):last-child{grid-column:1/-1}
.role{all:unset;box-sizing:border-box;cursor:pointer;background:#0f4523;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:background .2s,transform .2s}
.role:hover{background:#13562c}
.role[aria-current=true]{background:#fff;color:var(--g);border-color:#fff}
.role h3{margin:0;font-size:18px;line-height:1.2;font-weight:600}
.role .tl{font-size:14px;opacity:.85}
.role .tags{display:flex;flex-wrap:wrap;gap:5px}
.role .tags i{font-style:normal;font-size:13px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.role[aria-current=true] .tags i{background:#e6f2ea}
.role .go{font-size:13px;font-weight:600;margin-top:auto}
.role[aria-current=true] .go{color:var(--acc)}
.profile{background:var(--g);color:#fff;padding-bottom:0;padding-top:clamp(20px,3vw,36px)}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,32px);align-items:center;background:var(--bg);color:var(--ink);border-radius:18px 18px 0 0;padding:clamp(18px,3vw,32px)}
.prof img{width:clamp(92px,12vw,132px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid var(--soft)}
.prof h2{margin:0;font-size:clamp(28px,3.6vw,42px);line-height:1.05;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.prof .sub{color:var(--mut);margin:6px 0 12px}
.kpis{display:flex;flex-wrap:wrap;gap:10px 28px}
.kpis div b{display:block;font-size:24px;font-weight:600;color:var(--acc);white-space:nowrap;line-height:1.1}
.kpis div span{font-size:13px;color:var(--mut)}
nav.sec{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:0 max(5vw,16px)}
nav.sec .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.sec a{flex:none;padding:12px 12px;text-decoration:none;color:var(--mut);font-weight:500;font-size:15px;border-bottom:2px solid transparent}
nav.sec a:hover{color:var(--ink);border-color:var(--g2)}
main .band{padding-top:clamp(22px,3vw,40px);padding-bottom:0}
section{scroll-margin-top:60px}
h4{font-size:24px;letter-spacing:-.01em;margin:0 0 14px;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(18px,3vw,40px)}
.about p{margin:0 0 12px;max-width:68ch}
.contact{background:var(--soft);border-radius:14px;padding:18px 20px}
.contact dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:15px}
.contact dt{color:var(--mut)}
.contact dd{margin:0;overflow-wrap:anywhere}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sk{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card)}
.sk b{display:block;margin-bottom:8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips i{font-style:normal;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--soft)}
.job{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 28px;padding:18px 0;border-top:1px solid var(--line)}
.job .when{color:var(--mut);font-size:14px}
.job .when b{display:block;color:var(--ink);font-size:15px}
.job h5{margin:0 0 2px;font-size:18px;font-weight:600}
.job .co{color:var(--g2);font-weight:600}
.job .team{font-size:14px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.job ul{margin:6px 0 0;padding-left:18px}
.job li{margin:4px 0}
.job li strong,.about strong{color:var(--ink);font-weight:700}
.more{all:unset;cursor:pointer;margin:6px 0 0;padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:15px}
.more:hover{background:var(--soft)}
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pj{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.pj .st{font-size:13px;font-weight:600;color:var(--g2)}
.pj h5{margin:0;font-size:17px}
.pj p{margin:0;font-size:15px;color:var(--mut)}
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;list-style:none;padding:0;margin:0}
.edu li{background:var(--soft);border-radius:12px;padding:14px 16px}
.edu li span{display:block;color:var(--mut);font-size:14px}
footer{margin-top:clamp(32px,5vw,64px);background:var(--g);color:#d6eadc;padding:24px max(5vw,16px);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:#fff}
.fade{animation:f .35s ease}
@keyframes f{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.role{transition:none}}

.dl{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 18px;min-height:44px;border-radius:999px;background:var(--g);color:#fff;font-weight:600;font-size:15px}
.dl:hover{background:#0d3d20}
.dl:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.dl[hidden]{display:none}
.dlmsg{font-size:14px;color:var(--mut);margin-left:10px}
@page{size:A4;margin:12mm 12mm 14mm}
@media(max-width:900px){.cover .wrap{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.roles{grid-template-columns:minmax(0,1fr)}.job{grid-template-columns:minmax(0,1fr)}.prof{grid-template-columns:minmax(0,1fr)}.facts b{font-size:17px}}
@media print{
:root{color-scheme:light}
body{font-size:11.2px;line-height:1.42;background:#fff;color:#111a14;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header.top,.cover,nav.sec,#more,.dl,.dlmsg,footer,.fade{animation:none}
header.top,.cover,nav.sec,#more,.dl,.dlmsg,footer{display:none!important}
.band{padding:0 0 10px}
.profile{background:#fff;color:#111a14;padding:0}
.prof{padding:0 0 12px;border-bottom:2px solid #12512a;border-radius:0;grid-template-columns:auto minmax(0,1fr)}
.prof img{width:92px}
.prof h2{font-size:28px}
.kpis div b{font-size:19px}
main .band{padding-top:12px}
h4{font-size:17px;margin:0 0 8px;color:#12512a}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.contact{padding:12px 14px}.contact dl{font-size:12px;gap:4px 10px}
.skills{display:block}.sk{border:0;border-radius:0;padding:2px 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 10px;background:none;margin:0 0 3px}.sk b{margin:0}.chips{display:block;line-height:1.45}.chips i{display:inline}.sk{align-items:start}.chips i{background:none;padding:0;font-size:11.2px}.chips i:not(:last-child)::after{content:' ·'}
.sk{padding:9px 11px}.chips i{font-size:11.5px;padding:1px 8px}
.job{grid-template-columns:118px minmax(0,1fr);gap:4px 16px;padding:7px 0}.job li{break-inside:avoid}.job h5,.job .team{break-after:avoid}.job .when{font-size:11px}.job .when b{font-size:11.5px}.job .team{font-size:11px;margin:6px 0 2px}.job ul{margin:3px 0 0}
.job h5{font-size:13px}.job li{margin:2px 0}
.projects{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pj{padding:10px 12px;break-inside:avoid}.pj p{font-size:12px}
.edu{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.edu li{padding:9px 11px}
.sk,.edu li{break-inside:avoid}
h4{break-after:avoid}
.about p{margin:0 0 7px;max-width:none}.pj h5{font-size:13px}.pj{gap:3px}.edu li span{font-size:11px}.edu b{font-size:12px}.sk b{font-size:11.2px;margin:0;color:#12512a}.prof .sub{margin:3px 0 6px}.kpis div span{font-size:11px}main .band{padding-top:8px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#fr-fullstack">Med Karim Bchini</a>
  <div class="lang" role="group" aria-label="Langue / Language">

  </div>
</div></header>

<div class="cover band"><div class="wrap">
  <div>

  <div class="roles" id="roles"></div>
</div></div>

<div class="profile band"><div class="wrap"><div class="prof" id="prof"></div></div></div>
<nav class="sec" aria-label="Sections"><div class="wrap" id="secnav"></div></nav>

const E=[
['Diplôme d\'ingénieur en informatique|Engineering degree in computer science','ESPRIT, Tunis · 2007 – 2010'],
['Études technologiques en informatique|Technology studies in computer science','ISI, Tunis'],
['Parcours Associate AI Engineer|Associate AI Engineer track','DataCamp · en cours|DataCamp · in progress'],
['Elements of AI for Business','Novembre 2025|November 2025'],
['Prise en main de l\'API OpenAI|Getting started with the OpenAI API','Octobre 2025|October 2025'],
['DevOps et Scrum · Tests automatisés|DevOps and Scrum · Automated testing','Jasmine, Selenium']];

const $=id=>document.getElementById(id);
const tr=(s,l)=>{const p=s.split('|');return l==='en'&&p[1]?p[1]:p[0]};
const has=(tags,v)=>{if(!tags)return true;const t=tags.split(' ');return v==='staff'?t.includes('ia')||t.includes('back'):t.includes(v==='lead'?'fullstack':v)};
let lang='fr',role='fullstack',expOpen=/print/.test(location.search),DL=null;
const STANDALONE=!(window.claude&&window.claude.use);

function parse(){const m=(location.hash||'').match(/^#(fr|en)-(lead|staff|ia|fullstack|back|front)$/);if(m){lang=m[1];role=m[2]}}
function go(l,r){location.hash=l+'-'+r}

function render(){
  const t=T[lang],v=V[role][lang];
  document.documentElement.lang=lang;
  document.title=`${v.t} — Med Karim Bchini`;
  for(const b of document.querySelectorAll('.lang button'))b.setAttribute('aria-pressed',b.dataset.l===lang);
  $('c-h1').textContent=t.h1;$('c-p').textContent=t.p;
  $('c-facts').innerHTML=t.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
  $('roles').innerHTML=ORDER.map(k=>{const r=V[k][lang],on=k===role;return `<button class="role" type="button" id="r-${k}" data-r="${k}" aria-current="${on}"><h3>${r.t}</h3><span class="tl">${r.tl}</span><span class="tags">${V[k].tags.map(x=>`<i>${tr(x,lang)}</i>`).join('')}</span><span class="go">${on?t.view:t.open}</span></button>`}).join('');
  $('prof').innerHTML=`<img src="${PHOTO}" alt="Med Karim Bchini"><div><h2>${v.t}</h2><div class="sub">Med Karim Bchini · ${v.s}</div><div class="kpis">${v.k.map(k=>`<div><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div><button class="dl" id="dl" type="button" ${DL||STANDALONE?'':'hidden'}>${t.pdf}</button><span class="dlmsg" id="dlmsg" role="status"></span></div>`;
  $('secnav').innerHTML=Object.entries(t.nav).map(([k,n])=>`<a href="#${lang}-${role}" data-s="${k}">${n}</a>`).join('');
  const jobs=J.map(j=>{const h=j[lang];const body=j.teams.map(tm=>{const b=tm.b.filter(x=>has(x[0],role));if(!b.length)return '';return (tm.fr?`<div class="team">${tm[lang]}</div>`:'')+`<ul>${b.map(x=>`<li>${lang==='fr'?x[1]:x[2]}</li>`).join('')}</ul>`}).join('');
    return `<div class="job"><div class="when"><b>${h.w}</b>${h.d}</div><div><h5>${h.t} <span class="co">· ${j.co}</span></h5>${body}</div></div>`});
  const shown=expOpen?jobs:jobs.slice(0,3);
  const proj=P.filter(p=>has(p[0],role)).sort((a,b)=>(b[1]===(role==='ia'||role==='staff'?'RAG':'x'))-(a[1]===(role==='ia'||role==='staff'?'RAG':'x')));
  $('main').innerHTML=`
  <div class="band fade"><div class="wrap">
   <section id="s-about" class="two"><div class="about"><h4>${t.nav.about}</h4>${v.a.map(p=>`<p>${p}</p>`).join('')}</div>
    <aside class="contact"><h4>${t.contact}</h4><dl>
     <dt>${t.email}</dt><dd><a href="mailto:mohkarb@gmail.com">mohkarb@gmail.com</a></dd>
     <dt>${t.phone}</dt><dd>+216 22 976 075 (WhatsApp)</dd>
     <dt>LinkedIn</dt><dd><a href="https://www.linkedin.com/in/bchinimedkarim/">linkedin.com/in/bchinimedkarim</a></dd>
     <dt>GitHub</dt><dd><a href="https://github.com/karimtn">github.com/karimtn</a></dd>
     <dt>${t.loc}</dt><dd>${t.locv}</dd>
     <dt>${t.permit}</dt><dd>${t.permitv}</dd>
     <dt>${t.langs}</dt><dd>${t.langsv}</dd></dl></aside></section>
  </div></div>
  <div class="band"><div class="wrap"><section id="s-skills"><h4>${t.nav.skills}</h4><div class="skills">${V[role].sk.map(k=>`<div class="sk"><b>${SK[k][lang]}</b><div class="chips">${SK[k].v.map(x=>`<i>${tr(x,lang)}</i>`).join('')}</div></div>`).join('')}</div></section></div></div>
  <div class="band"><div class="wrap"><section id="s-exp"><h4>${t.nav.exp}</h4>${shown.join('')}<button class="more" id="more" type="button">${expOpen?t.less:t.all(jobs.length)}</button></section></div></div>
  <div class="band"><div class="wrap"><section id="s-proj"><h4>${t.nav.proj}</h4><div class="projects">${proj.map(p=>`<div class="pj"><span class="st">${tr(p[7],lang)}</span><h5>${lang==='fr'?p[2]:p[3]}</h5><p>${lang==='fr'?p[4]:p[5]}</p><p>${p[6]}</p>${p[8]?`<a href="${p[8]}">${p[8].replace('https://','')}</a>`:''}</div>`).join('')}</div></section></div></div>
  <div class="band"><div class="wrap"><section id="s-edu"><h4>${t.eduT}</h4><ul class="edu">${E.map(e=>`<li><b>${tr(e[0],lang)}</b><span>${tr(e[1],lang)}</span></li>`).join('')}</ul></section></div></div>`;
  $('foot').textContent=`${t.foot} · ${v.t}`;
}

document.addEventListener('click',e=>{
  const l=e.target.closest('.lang button');if(l){go(l.dataset.l,role);return}
  const r=e.target.closest('.role');if(r){expOpen=false;go(lang,r.dataset.r);document.querySelector('.profile').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
  const s=e.target.closest('nav.sec a');if(s){e.preventDefault();$('s-'+s.dataset.s)?.scrollIntoView({behavior:'smooth'});return}
  if(e.target.closest('#dl')){savePdf();return}
  if(e.target.id==='more'){expOpen=!expOpen;render();$('s-exp').scrollIntoView()}
});
window.addEventListener('hashchange',()=>{parse();render()});
const pdfName=()=>`CV-Med-Karim-Bchini-${V[role][lang].t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/-+$/,'')}-${lang.toUpperCase()}.pdf`;
async function savePdf(){
  const t=T[lang],m=$('dlmsg');
  if(!DL){const a=document.createElement('a');a.href=`pdf/${role}-${lang}.pdf`;a.download=pdfName();document.body.appendChild(a);a.click();a.remove();return}
  m.textContent=t.pdfwait;
  try{
    const res=await fetch(`pdf/${role}-${lang}.pdf`);if(!res.ok)throw {code:'unavailable'};
    const blob=await res.blob();
    await DL.save({filename:pdfName(),data:blob});
    m.textContent='';
  }catch(err){m.textContent=err&&err.code==='declined'?t.pdfno:t.pdferr}
}
parse();render();
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{if(d){DL=d;const b=$('dl');if(b)b.hidden=false}}).catch(()=>{})}
}
</script>
